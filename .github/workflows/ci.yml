name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux (Nim 2.2 & latest)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out satellite repository
        uses: actions/checkout@v4
        with:
          path: satellite

      - name: Check out nim-esphome
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nim-esphome
          path: nim-esphome

      - name: Check out nim-typestates
        uses: actions/checkout@v4
        with:
          repository: elijahr/nim-typestates
          path: nim-typestates

      - name: Cache asdf tools
        uses: actions/cache@v4
        with:
          path: ~/.asdf
          key: asdf-ci-${{ runner.os }}-nim-2.2.10-2.2.8
          restore-keys: |
            asdf-ci-${{ runner.os }}-

      - name: Install Nim (latest)
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Test on Nim latest (2.2.10)
        working-directory: satellite
        run: |
          asdf set nim 2.2.10
          nim c -r --path:../nim-esphome/src --path:../nim-typestates/src tests/test_fsm.nim
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:esp --os:any --exceptions:goto --panics:on --path:../nim-esphome/src --path:../nim-typestates/src src/nim_esphome_satellite.nim

      - name: Test on Nim 2.2 (minimum supported 2.2.8)
        working-directory: satellite
        run: |
          asdf install nim 2.2.8
          asdf set nim 2.2.8
          nim c -r --path:../nim-esphome/src --path:../nim-typestates/src tests/test_fsm.nim
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:esp --os:any --exceptions:goto --panics:on --path:../nim-esphome/src --path:../nim-typestates/src src/nim_esphome_satellite.nim

  trainer-test:
    name: Test In-Browser Wake Word Trainer (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out satellite repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters:
            trainer:
              - 'trainer/**'

      - name: Set up Node.js
        if: steps.filter.outputs.trainer == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: trainer/package-lock.json

      - name: Install trainer dependencies
        if: steps.filter.outputs.trainer == 'true'
        working-directory: trainer
        run: npm ci || npm install

      - name: Typecheck trainer
        if: steps.filter.outputs.trainer == 'true'
        working-directory: trainer
        run: npm run typecheck

      - name: Run trainer tests
        if: steps.filter.outputs.trainer == 'true'
        working-directory: trainer
        run: npm test


