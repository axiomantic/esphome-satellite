# Note: Primary CI runs on self-hosted Forgejo Actions (https://git.axiomantic.dev).
# GitHub is maintained as a manual mirror; push-triggered CI is disabled on GitHub
# to avoid duplicate execution on mirror pushes. This workflow can be triggered
# manually via workflow_dispatch or on pull requests against main.
# No Windows or macOS runners exist in this repository; all legs are Linux-based.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux (Nim 2.2 & latest)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out satellite repository
        uses: actions/checkout@v4
        with:
          path: satellite

      - name: Check out nim-esphome
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nim-esphome
          path: nim-esphome

      - name: Check out nim-typestates
        uses: actions/checkout@v4
        with:
          repository: elijahr/nim-typestates
          path: nim-typestates

      - name: Cache asdf tools
        uses: actions/cache@v4
        with:
          path: ~/.asdf
          key: asdf-ci-${{ runner.os }}-nim-2.2.10-2.2.8
          restore-keys: |
            asdf-ci-${{ runner.os }}-

      - name: Install Nim (latest)
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Test on Nim latest (2.2.10)
        working-directory: satellite
        run: |
          asdf set nim 2.2.10
          ./scripts/ci/test.sh

      - name: Test on Nim 2.2 (minimum supported 2.2.8)
        working-directory: satellite
        run: |
          asdf install nim 2.2.8
          asdf set nim 2.2.8
          ./scripts/ci/test.sh


