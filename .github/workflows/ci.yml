name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Linux (Nim ${{ matrix.nim_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nim_version: ["2.2.10", "2.2.8"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out satellite repository
        uses: actions/checkout@v4
        with:
          path: satellite

      - name: Check out nim-esphome
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nim-esphome
          path: nim-esphome

      - name: Check out nim-typestates
        uses: actions/checkout@v4
        with:
          repository: elijahr/nim-typestates
          path: nim-typestates

      - name: Cache asdf tools
        uses: actions/cache@v4
        with:
          path: ~/.asdf
          key: asdf-ci-${{ runner.os }}-nim-${{ matrix.nim_version }}
          restore-keys: |
            asdf-ci-${{ runner.os }}-

      - name: Install Nim (${{ matrix.nim_version }})
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim ${{ matrix.nim_version }}

      - name: Run Nim test suites and ESP32 C++ syntax check
        working-directory: satellite
        run: |
          set -euo pipefail
          asdf set nim ${{ matrix.nim_version }}
          NIM_OPTS=(--path:../nim-esphome/src --path:../nim-typestates/src)
          for t in tests/test_fsm.nim tests/test_version_sync.nim tests/test_audio_dsp.nim tests/test_audio_volume.nim tests/test_xvf3800.nim tests/test_wake_loader.nim tests/test_pcm_player.nim tests/test_cancellation.nim tests/test_nvs_migration.nim tests/test_satellite_system.nim tests/test_audio_stream_tracker.nim tests/test_watchdog_loop.nim; do
            if [ -f "$t" ]; then
              echo "--- Running $t ---"
              nim c -r "${NIM_OPTS[@]}" "$t"
              rm -f "${t%.nim}"
            fi
          done
          echo "--- Verifying ESP32 compilation syntax for src/nim_esphome_satellite.nim ---"
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome \
            --cpu:esp --os:any --exceptions:goto --panics:on \
            "${NIM_OPTS[@]}" src/nim_esphome_satellite.nim
