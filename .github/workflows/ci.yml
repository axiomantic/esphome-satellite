name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux (Nim 2.2 & Stable)
    runs-on: ubuntu-latest

    steps:
      - name: Check out satellite repository
        uses: actions/checkout@v4
        with:
          path: satellite

      - name: Check out nim-esphome
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nim-esphome
          path: nim-esphome

      - name: Check out nim-typestates
        uses: actions/checkout@v4
        with:
          repository: elijahr/nim-typestates
          path: nim-typestates

      - name: Set up Nim 2.2
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'

      - name: Run Typestate Tests (Nim 2.2)
        working-directory: satellite
        run: |
          nim c -r --path:../nim-esphome/src --path:../nim-typestates/src tests/test_fsm.nim

      - name: Test C++ Transpilation (Nim 2.2)
        working-directory: satellite
        run: |
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:esp --os:any --exceptions:goto --panics:on --path:../nim-esphome/src --path:../nim-typestates/src src/nim_esphome_satellite.nim

      - name: Set up Nim Stable
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Run Typestate Tests (Nim Stable)
        working-directory: satellite
        run: |
          nim c -r --path:../nim-esphome/src --path:../nim-typestates/src tests/test_fsm.nim

      - name: Test C++ Transpilation (Nim Stable)
        working-directory: satellite
        run: |
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:esp --os:any --exceptions:goto --panics:on --path:../nim-esphome/src --path:../nim-typestates/src src/nim_esphome_satellite.nim
