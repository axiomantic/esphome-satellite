name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim (latest)
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Build Factory Binary
        run: |
          chmod +x scripts/build_factory_binary.sh
          ./scripts/build_factory_binary.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            web/firmware-factory.bin \
            web/firmware-ota.bin \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" \
            web/firmware-factory.bin \
            web/firmware-ota.bin --clobber

      # =========================================================================
      # DEPLOY RELEASE FIRMWARE TO GITHUB PAGES WEB INSTALLER
      # =========================================================================
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

