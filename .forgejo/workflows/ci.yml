name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: docker
    container: nimlang/nim:2.2.10
    steps:
      - name: Diagnostic Step
        run: |
          echo "=== Diagnostic Step ==="
          echo "User: $(whoami)"
          echo "Nim: $(nim --version | head -n 1)"
          echo "Git: $(git --version)"
