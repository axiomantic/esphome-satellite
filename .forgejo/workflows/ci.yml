name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: docker
    container: nimlang/nim:2.2.10
    steps:
      - name: Verify Repo Files
        run: |
          test -f scripts/ci/test.sh
          test -f src/nim_esphome_satellite.nim
          test -f packages/respeaker_xvf3800.yaml
