name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: docker
    container: node:20-bookworm
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Verify files
        run: |
          ls -la
          test -f scripts/ci/test.sh && echo "Checkout succeeded!"
