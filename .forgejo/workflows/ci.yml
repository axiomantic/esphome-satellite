name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: docker
    container: nimlang/nim:2.2.10
    steps:
      - name: Test Network and Clone
        run: |
          curl -I -s --connect-timeout 5 https://git.axiomantic.dev >/dev/null || exit 1
          curl -I -s --connect-timeout 5 https://github.com >/dev/null || exit 2
