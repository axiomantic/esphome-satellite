name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux
    runs-on: docker
    container: nimlang/nim:2.2.10
    steps:
      - name: Inspect Workspace
        run: |
          echo "=== Workspace Inspection ==="
          pwd
          ls -la
          git status || true
