# =============================================================================
# esphome-satellite: Seeed ReSpeaker XVF3800 Drop-in Hardware Configuration
# =============================================================================

substitutions:
  name: "esphome-satellite"
  friendly_name: "Voice Satellite"
  processing_sound_default: "Spinner"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "axiomantic.esphome-satellite"
    version: "0.2.0"
  includes:
    - ../src/nim_satellite_bridge.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/axiomantic/nim-esphome
      ref: main
    components: [nim]

nim:
  source: ../src/nim_esphome_satellite.nim
  nim_flags:
    - "-d:danger"
    - "-d:useMalloc"
    - "-d:esphome"
  requires:
    - https://github.com/elijahr/nim-typestates

wifi:
  ap:
    ssid: "Satellite Fallback Hotspot"

captive_portal:

api:
  services:
    - service: test_audio_feedback
      variables:
        style: string
        volume: float
      then:
        - lambda: |-
            call_nim_action_test_audio(style.c_str(), volume);
    - service: set_privacy_mute
      variables:
        muted: bool
      then:
        - lambda: |-
            call_nim_action_set_mute(muted);

ota:
  - platform: esphome

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: right

micro_wake_word:
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - lambda: |-
        call_nim_wake_word(wake_word.c_str(), 0);

voice_assistant:
  microphone: board_mic
  on_start:
    - lambda: |-
        call_nim_chime_done(true);
  on_stt_vad_end:
    - lambda: |-
        call_nim_speech_ended();
  on_tts_start:
    - lambda: |-
        call_nim_tts_start();
  on_tts_end:
    - lambda: |-
        call_nim_tts_end();
  on_error:
    - lambda: |-
        call_nim_error(code.c_str());
  on_client_connected:
    - lambda: |-
        call_nim_connected();
  on_client_disconnected:
    - lambda: |-
        call_nim_disconnected();

select:
  - platform: template
    id: processing_sound
    name: "Processing Sound"
    icon: "mdi:progress-clock"
    optimistic: true
    initial_option: ${processing_sound_default}
    restore_value: true
    options:
      - "Silent"
      - "Spinner"
      - "Pulse"
      - "Sonar"
      - "Tick"

number:
  - platform: template
    id: processing_sound_volume
    name: "Processing Sound Volume"
    icon: "mdi:volume-medium"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true

  - platform: template
    id: wake_chime_volume
    name: "Wake Chime Volume"
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true

switch:
  - platform: template
    id: wake_chime
    name: "Wake Chime"
    icon: "mdi:bell-ring"
    optimistic: true

