# =============================================================================
# esphome-satellite: Seeed ReSpeaker XVF3800 Drop-in Hardware Configuration
# =============================================================================

substitutions:
  name: "esphome-satellite"
  friendly_name: "Voice Satellite"
  version: "0.6.1"
  processing_sound_default: "Spinner"
  wake_chime_sound_default: "Bell Ping"
  processing_sound_volume_default: "75"
  wake_chime_volume_default: "75"
  voice_volume_default: "80"

globals:
  - id: active_assistant_slot
    type: int
    initial_value: '1'
  - id: previous_assistant_slot
    type: int
    initial_value: '1'

preferences:
  flash_write_interval: 2s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "axiomantic.esphome-satellite"
    version: ${version}
  includes:
    - ../src/nim_satellite_bridge.h
    - ../src/xvf3800_hardware.h
    - ../src/sound_data.h
    - ../src/pcm_sound_player.h
    - ../src/wake_partition_loader.h
    - ../src/nvs_migration.h
  build_flags:
    - -Wno-write-strings
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            esphome::migrate_legacy_nvs_preferences(
                id(slot1_volume), id(slot1_cancel_sound), id(slot1_wake_chime_sound),
                id(slot1_processing_sound), id(slot1_sensitivity),
                id(slot1_wake_chime), id(slot1_cancel_sound_switch));
            esphome::xvf3800::XVF3800Hardware::instance().init(id(bus_a));
            esphome::get_pcm_sound_player().set_speaker(id(board_speaker));
            esphome::get_pcm_sound_player().init_partitions(
                id(slot1_wake_chime_sound), id(slot1_processing_sound), id(slot1_cancel_sound),
                id(slot2_wake_chime_sound), id(slot2_processing_sound), id(slot2_cancel_sound));
            esphome::get_pcm_sound_player().set_on_finished([]() {
              float vol = (id(active_assistant_slot) == 2 ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
              id(board_speaker).set_volume(vol);
            });
            esphome::get_pcm_sound_player().set_on_cancel_finished([]() {
              if (id(mww) != nullptr && !id(mic_mute_switch).state) {
                id(mww)->start();
              }
            });
            id(board_speaker).set_volume(id(slot1_volume).state / 100.0f);
        - lambda: |-
            esphome::wake_loader::get_wake_partition_loader().init(
                id(mww), id(slot1_wake_word), id(slot2_wake_word));
            esphome::wake_loader::get_wake_partition_loader().update_slot_models(
                id(slot1_wake_word).current_option(),
                id(slot2_wake_word).current_option(),
                id(clemens_model),
                id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_slot_sensitivity(
                1, id(slot1_sensitivity).current_option(), id(clemens_model), id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_slot_sensitivity(
                2, id(slot2_sensitivity).current_option(), id(clemens_model), id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_slot_cutoff_override(
                1, id(slot1_cutoff).state, id(clemens_model), id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_slot_cutoff_override(
                2, id(slot2_cutoff).state, id(clemens_model), id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_sliding_window(
                static_cast<size_t>(id(wake_window_size).state), id(clemens_model), id(nabu_model));
            esphome::wake_loader::get_wake_partition_loader().set_mic_pre_gain(
                id(mic_pre_gain_boost).state);
        - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  partitions: ../partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: git
      url: https://github.com/axiomantic/nim-esphome
      ref: main
    components: [nim]
  - source:
      type: local
      path: ../components
    components: [aic3104, i2s_audio]

binary_sensor:
  - platform: gpio
    id: user_button
    name: "Mute Button"
    internal: true
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - switch.toggle: mic_mute_switch

  - platform: template
    id: firmware_update_available
    name: "System: Firmware Update Available"
    icon: "mdi:cloud-download-outline"
    device_class: update
    entity_category: diagnostic
    lambda: |-
      if (id(satellite_firmware_update).has_state()) {
        return id(satellite_firmware_update).state == esphome::update::UPDATE_STATE_AVAILABLE;
      }
      return false;

nim:
  source: ../src/nim_esphome_satellite.nim
  nim_flags:
    - "-d:danger"
    - "-d:useMalloc"
    - "-d:esphome"
    - "-d:noSignalHandler"
  requires:
    - https://github.com/elijahr/nim-typestates

wifi:
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: "Satellite Fallback Hotspot"

captive_portal:

logger:

improv_serial:

safe_mode:
  disabled: true

api:
  services:
    - service: test_audio_feedback
      variables:
        style: string
        volume: float
      then:
        - lambda: |-
            call_nim_action_test_audio(style.c_str(), volume);
    - service: set_privacy_mute
      variables:
        muted: bool
      then:
        - lambda: |-
            call_nim_action_set_mute(muted);
    - service: install_custom_wake_word
      variables:
        url: string
        slot: int
        wake_word: string
      then:
        - lambda: |-
            extern void nim_satellite_ota_start() __attribute__((weak));
            if (nim_satellite_ota_start != nullptr) nim_satellite_ota_start();
        - micro_wake_word.stop:
        - lambda: |-
            bool ok = esphome::wake_loader::get_wake_partition_loader().install_custom_wake_word_from_url(
                url, slot, wake_word, 102, 5);
            if (!ok) {
              ESP_LOGE("satellite", "Failed to install custom wake word from %s", url.c_str());
              extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
              if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
              return;
            }
            ESP_LOGI("satellite", "Custom wake word '%s' installed. Restarting in 1s...", wake_word.c_str());
        - lambda: |-
            extern void nim_satellite_restart(void) __attribute__((weak));
            if (nim_satellite_restart != nullptr) nim_satellite_restart();
            else esp_restart();
    - service: remove_custom_wake_word
      variables:
        slot: int
      then:
        - lambda: |-
            extern void nim_satellite_ota_start() __attribute__((weak));
            if (nim_satellite_ota_start != nullptr) nim_satellite_ota_start();
        - micro_wake_word.stop:
        - lambda: |-
            bool ok = esphome::wake_loader::get_wake_partition_loader().remove_custom_wake_word(slot);
            if (!ok) {
              ESP_LOGE("satellite", "Failed to remove custom wake word from slot %d", slot);
              extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
              if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
              return;
            }
            ESP_LOGI("satellite", "Custom wake word removed from slot %d. Restarting in 1s...", slot);
        - lambda: |-
            extern void nim_satellite_restart(void) __attribute__((weak));
            if (nim_satellite_restart != nullptr) nim_satellite_restart();
            else esp_restart();
    - service: update_firmware_from_url
      variables:
        url: string
      then:
        - lambda: |-
            esphome::wake_loader::get_wake_partition_loader().flash_firmware_ota(url);
    - service: update_firmware_to_latest
      then:
        - lambda: |-
            esphome::wake_loader::get_wake_partition_loader().flash_firmware_ota(
                "https://raw.githubusercontent.com/axiomantic/esphome-satellite/main/web/firmware-ota.bin");

http_request:
  id: http_client_id
  timeout: 30s

web_server:
  port: 80
  js_include: web_update.js

update:
  - platform: http_request
    id: satellite_firmware_update
    name: "Firmware"
    source: "https://raw.githubusercontent.com/axiomantic/esphome-satellite/main/web/manifest.json"
    on_update_available:
      - lambda: |-
          ESP_LOGI("update", "New firmware update available: %s", x.latest_version.c_str());
          id(firmware_update_available).publish_state(true);
          id(latest_firmware_version).publish_state(x.latest_version);

ota:
  - platform: esphome
    on_begin:
      - lambda: |-
          if (global_preferences != nullptr) global_preferences->sync();
          extern void nim_satellite_ota_start() __attribute__((weak));
          if (nim_satellite_ota_start != nullptr) nim_satellite_ota_start();
          esphome::wake_loader::get_wake_partition_loader().suspend_inference_for_flash();
    on_end:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(true);
    on_error:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();
    on_abort:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();
  - platform: http_request
    id: ota_http
    on_begin:
      - lambda: |-
          if (global_preferences != nullptr) global_preferences->sync();
          extern void nim_satellite_ota_start() __attribute__((weak));
          if (nim_satellite_ota_start != nullptr) nim_satellite_ota_start();
          esphome::wake_loader::get_wake_partition_loader().suspend_inference_for_flash();
    on_end:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(true);
    on_error:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();
    on_abort:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();
  - platform: web_server
    id: ota_web
    on_begin:
      - lambda: |-
          if (global_preferences != nullptr) global_preferences->sync();
          extern void nim_satellite_ota_start() __attribute__((weak));
          if (nim_satellite_ota_start != nullptr) nim_satellite_ota_start();
          esphome::wake_loader::get_wake_partition_loader().suspend_inference_for_flash();
    on_end:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(true);
    on_error:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();
    on_abort:
      - lambda: |-
          extern void nim_satellite_ota_end(bool ok) __attribute__((weak));
          if (nim_satellite_ota_end != nullptr) nim_satellite_ota_end(false);
          esphome::wake_loader::get_wake_partition_loader().resume_inference_after_flash();

i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: bus_a

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

  - id: i2s_out
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO43
    i2s_mode: secondary
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_raw_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_out
    dac_type: external
    channel: stereo
    audio_dac: aic3104_dac
    timeout: never

  - platform: resampler
    id: board_speaker
    output_speaker: i2s_raw_speaker

media_player:
  - platform: speaker
    id: board_media_player
    name: "Voice Satellite Speaker"
    announcement_pipeline:
      speaker: board_speaker

micro_wake_word:
  id: mww
  microphone:
    microphone: board_mic
    channels: 1
  stop_after_detection: false
  models:
    - model: ../assets/models/clemens.json
      id: clemens_model
    - model: okay_nabu
      id: nabu_model
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: mic_mute_switch
        then:
          - lambda: |-
              ESP_LOGD("satellite", "Wake word '%s' ignored because mic is muted.", wake_word.c_str());
        else:
          - lambda: |-
              int slot = esphome::wake_loader::get_wake_partition_loader().get_slot_for_wake_word(wake_word);
              id(previous_assistant_slot) = id(active_assistant_slot);
              id(active_assistant_slot) = slot;
              if (id(previous_assistant_slot) != slot) {
                ESP_LOGI("satellite", "Switched from Slot %d to Slot %d. Resetting conversation ID for isolation.",
                         id(previous_assistant_slot), slot);
                id(va).reset_conversation_id();
              }
              call_nim_wake_word(wake_word.c_str(), 0);
          - micro_wake_word.stop:
          - if:
              condition:
                api.connected:
              then:
                - if:
                    condition:
                      lambda: |-
                        bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime).state : id(slot1_wake_chime).state;
                        std::string snd = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                        return enabled && snd != "Silent";
                    then:
                      - lambda: |-
                          std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                          float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
                          esphome::get_pcm_sound_player().play_chime(opt, false, vol);
                      - wait_until:
                          condition:
                            lambda: |-
                              return !esphome::get_pcm_sound_player().is_playing();
                          timeout: 2000ms
                    else:
                      - lambda: |-
                          call_nim_chime_done(true);
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;
              else:
                - script.execute:
                    id: connect_and_start_assistant
                    ww: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: board_mic
  speaker: board_speaker
  micro_wake_word: mww
  conversation_timeout: 300s
  on_start:
    - lambda: |-
        std::string st = get_satellite_state_name();
        if (st == "Follow Up") {
          ESP_LOGI("satellite", "Continuous dialogue start: active listening in Follow Up state.");
        } else {
          call_nim_chime_done(true);
        }
  on_stt_vad_end:
    - lambda: |-
        call_nim_speech_ended();
        std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_processing_sound).current_option() : id(slot1_processing_sound).current_option();
        float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
        esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
  on_stt_end:
    - lambda: |-
        bool is_reset = call_nim_is_reset_phrase(x.c_str());
        if (is_reset) {
          ESP_LOGI("voice_assistant", "Explicit conversation reset requested: '%s'. Clearing conversation history.", x.c_str());
          id(va).reset_conversation_id();
          esphome::get_pcm_sound_player().stop();
          call_nim_stop_word();
          std::string cancel_opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
          if (cancel_opt == "Match Wake Chime") {
            cancel_opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
          }
          float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
          bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
          if (enabled && cancel_opt != "Silent") {
            esphome::get_pcm_sound_player().play_cancel_sound(cancel_opt, false, vol);
          } else {
            call_nim_cancel_done(true);
          }
          id(va).request_stop();
          return;
        }

        bool should_cancel = call_nim_is_cancellation(x.c_str(), id(stop_words_config).state.c_str());

        if (should_cancel) {
          ESP_LOGI("voice_assistant", "Cancellation detected in '%s'. Triggering cancel sound and aborting.", x.c_str());
          esphome::get_pcm_sound_player().stop();
          call_nim_stop_word();
          bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
          bool played_cancel = false;
          if (enabled) {
            std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
            if (opt == "Match Wake Chime") {
              opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
            }
            if (opt != "Silent") {
              float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
              esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
              played_cancel = true;
            }
          }
          if (!played_cancel) {
            float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
            id(board_speaker).set_volume(vol);
            call_nim_cancel_done(true);
          }
          id(va).request_stop();
        } else {
          if (std::string(get_satellite_state_name()) != "Thinking") {
            call_nim_speech_ended();
            std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_processing_sound).current_option() : id(slot1_processing_sound).current_option();
            float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
            esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
          }
        }
  on_tts_start:
    - lambda: |-
        esphome::get_pcm_sound_player().stop();
        float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
        id(board_speaker).set_volume(vol);
        call_nim_tts_start();
  on_tts_end:
    - lambda: |-
        if (esphome::voice_assistant::VoiceAssistantAccessor::is_continuing(id(va))) {
          ESP_LOGI("satellite", "Continuous dialogue active. Transitioning to Follow Up.");
          call_nim_follow_up();
        } else {
          call_nim_tts_end();
        }
  on_end:
    - lambda: |-
        if (!esphome::voice_assistant::VoiceAssistantAccessor::is_continuing(id(va))) {
          if (!esphome::get_pcm_sound_player().is_playing_cancel()) {
            esphome::get_pcm_sound_player().stop();
            float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
            id(board_speaker).set_volume(vol);
          }
          if (!call_nim_is_cancelling()) {
            call_nim_stop_word();
          }
        }
    - if:
        condition:
          lambda: |-
            return !esphome::voice_assistant::VoiceAssistantAccessor::is_continuing(id(va)) && !call_nim_is_cancelling() && !id(mic_mute_switch).state;
        then:
          - micro_wake_word.start:
  on_error:
    - lambda: |-
        esphome::get_pcm_sound_player().stop();
        bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
        bool played_cancel = false;
        if (enabled) {
          std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
          if (opt == "Match Wake Chime") {
            opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
          }
          if (opt != "Silent") {
            float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
            esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
            played_cancel = true;
          }
        }
        if (!played_cancel) {
          float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
          id(board_speaker).set_volume(vol);
        }
        call_nim_error(code.c_str());
    - if:
        condition:
          lambda: |-
            return !esphome::get_pcm_sound_player().is_playing_cancel() && !call_nim_is_cancelling() && !id(mic_mute_switch).state;
        then:
          - micro_wake_word.start:
  on_client_connected:
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - micro_wake_word.start:
    - lambda: |-
        call_nim_connected();
