# =============================================================================
# esphome-satellite: Seeed ReSpeaker XVF3800 Drop-in Hardware Configuration
# =============================================================================

substitutions:
  name: "esphome-satellite"
  friendly_name: "Voice Satellite"
  version: "0.5.0"
  processing_sound_default: "Spinner"
  wake_chime_sound_default: "Bell Ping"
  processing_sound_volume_default: "75"
  wake_chime_volume_default: "75"
  voice_volume_default: "80"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "axiomantic.esphome-satellite"
    version: ${version}
  includes:
    - ../src/nim_satellite_bridge.h
    - ../src/xvf3800_hardware.h
    - ../src/sound_data.h
    - ../src/pcm_sound_player.h
    - ../src/wake_partition_loader.h
  build_flags:
    - -Wno-write-strings
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            esphome::xvf3800::XVF3800Hardware::instance().init(id(bus_a));
            esphome::get_pcm_sound_player().set_speaker(id(board_speaker));
            esphome::get_pcm_sound_player().init_partitions(
                id(wake_chime_sound), id(processing_sound), id(cancel_sound_sound));
            esphome::get_pcm_sound_player().set_on_finished([]() {
              id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
            });
            esphome::get_pcm_sound_player().set_on_cancel_finished([]() {
              if (id(mww) != nullptr && !id(mic_mute_switch).state) {
                id(mww)->start();
              }
            });
            id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
        - lambda: |-
            esphome::wake_loader::get_wake_partition_loader().init(id(mww), id(active_wake_word));
        - micro_wake_word.start:
        - lambda: |-
            std::string opt = id(active_wake_word).current_option();
            esphome::wake_loader::get_wake_partition_loader().handle_active_wake_word_change(
                opt, id(clemens_model), id(nabu_model));
            std::string sens = id(wake_word_sensitivity).current_option();
            esphome::wake_loader::get_wake_partition_loader().handle_sensitivity_change(
                sens, id(clemens_model), id(nabu_model));

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  partitions: ../partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: git
      url: https://github.com/axiomantic/nim-esphome
      ref: main
    components: [nim]
  - source:
      type: local
      path: ../components
    components: [aic3104, i2s_audio]

binary_sensor:
  - platform: gpio
    id: user_button
    name: "Mute Button"
    internal: true
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - switch.toggle: mic_mute_switch

nim:
  source: ../src/nim_esphome_satellite.nim
  nim_flags:
    - "-d:danger"
    - "-d:useMalloc"
    - "-d:esphome"
    - "-d:noSignalHandler"
  requires:
    - https://github.com/elijahr/nim-typestates

wifi:
  power_save_mode: NONE
  fast_connect: true
  ap:
    ssid: "Satellite Fallback Hotspot"

captive_portal:

logger:

improv_serial:

safe_mode:
  disabled: true

api:
  services:
    - service: test_audio_feedback
      variables:
        style: string
        volume: float
      then:
        - lambda: |-
            call_nim_action_test_audio(style.c_str(), volume);
    - service: set_privacy_mute
      variables:
        muted: bool
      then:
        - lambda: |-
            call_nim_action_set_mute(muted);

ota:
  - platform: esphome

i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: bus_a

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

  - id: i2s_out
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO43
    i2s_mode: secondary
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_raw_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_out
    dac_type: external
    channel: stereo
    audio_dac: aic3104_dac
    timeout: never

  - platform: resampler
    id: board_speaker
    output_speaker: i2s_raw_speaker

media_player:
  - platform: speaker
    id: board_media_player
    name: "Voice Satellite Speaker"
    announcement_pipeline:
      speaker: board_speaker

micro_wake_word:
  id: mww
  microphone:
    microphone: board_mic
    channels: 1
  stop_after_detection: false
  models:
    - model: ../assets/models/clemens.json
      id: clemens_model
    - model: okay_nabu
      id: nabu_model
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: mic_mute_switch
        then:
          - lambda: |-
              ESP_LOGD("satellite", "Wake word '%s' ignored because mic is muted.", wake_word.c_str());
        else:
          - lambda: |-
              call_nim_wake_word(wake_word.c_str(), 0);
          - micro_wake_word.stop:
          - if:
              condition:
                api.connected:
              then:
                - if:
                    condition:
                      lambda: |-
                        return id(wake_chime).state && id(wake_chime_sound).current_option() != "Silent";
                    then:
                      - lambda: |-
                          std::string opt = id(wake_chime_sound).current_option();
                          float vol = id(wake_chime_volume).state / 100.0f;
                          esphome::get_pcm_sound_player().play_chime(opt, false, vol);
                      - wait_until:
                          condition:
                            lambda: |-
                              return !esphome::get_pcm_sound_player().is_playing();
                          timeout: 2000ms
                    else:
                      - lambda: |-
                          call_nim_chime_done(true);
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;
              else:
                - script.execute:
                    id: connect_and_start_assistant
                    ww: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: board_mic
  speaker: board_speaker
  conversation_timeout: 45s
  on_start:
    - lambda: |-
        call_nim_chime_done(true);
  on_stt_vad_end:
    - lambda: |-
        call_nim_speech_ended();
        std::string opt = id(processing_sound).current_option();
        float vol = id(processing_sound_volume).state / 100.0f;
        esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
  on_stt_end:
    - lambda: |-
        bool should_cancel = call_nim_is_cancellation(x.c_str(), id(stop_words_config).state.c_str());

        if (should_cancel) {
          ESP_LOGI("voice_assistant", "Cancellation detected in '%s'. Triggering cancel sound and aborting.", x.c_str());
          esphome::get_pcm_sound_player().stop();
          call_nim_stop_word();
          bool played_cancel = false;
          if (id(cancel_sound_switch).state) {
            std::string opt = id(cancel_sound_sound).current_option();
            if (opt == "Match Wake Chime") {
              opt = id(wake_chime_sound).current_option();
            }
            if (opt != "Silent") {
              float vol = id(cancel_sound_volume).state / 100.0f;
              esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
              played_cancel = true;
            }
          }
          if (!played_cancel) {
            id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
            call_nim_cancel_done(true);
          }
          id(va).request_stop();
        } else {
          if (std::string(get_satellite_state_name()) != "Thinking") {
            call_nim_speech_ended();
            std::string opt = id(processing_sound).current_option();
            float vol = id(processing_sound_volume).state / 100.0f;
            esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
          }
        }
  on_tts_start:
    - lambda: |-
        esphome::get_pcm_sound_player().stop();
        id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
        call_nim_tts_start();
  on_tts_end:
    - lambda: |-
        call_nim_tts_end();
  on_end:
    - lambda: |-
        if (!esphome::get_pcm_sound_player().is_playing_cancel()) {
          esphome::get_pcm_sound_player().stop();
          id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
        }
        if (!call_nim_is_cancelling()) {
          call_nim_stop_word();
        }
    - if:
        condition:
          lambda: |-
            return !call_nim_is_cancelling() && !id(mic_mute_switch).state;
        then:
          - micro_wake_word.start:
  on_error:
    - lambda: |-
        esphome::get_pcm_sound_player().stop();
        bool played_cancel = false;
        if (id(cancel_sound_switch).state) {
          std::string opt = id(cancel_sound_sound).current_option();
          if (opt == "Match Wake Chime") {
            opt = id(wake_chime_sound).current_option();
          }
          if (opt != "Silent") {
            float vol = id(cancel_sound_volume).state / 100.0f;
            esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
            played_cancel = true;
          }
        }
        if (!played_cancel) {
          id(board_speaker).set_volume(id(voice_volume).state / 100.0f);
        }
        call_nim_error(code.c_str());
    - if:
        condition:
          lambda: |-
            return !esphome::get_pcm_sound_player().is_playing_cancel() && !call_nim_is_cancelling() && !id(mic_mute_switch).state;
        then:
          - micro_wake_word.start:
  on_client_connected:
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - micro_wake_word.start:
    - lambda: |-
        call_nim_connected();
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - lambda: |-
        call_nim_disconnected();

text:
  - platform: template
    id: stop_words_config
    name: "Cancellation Words"
    icon: "mdi:cancel"
    entity_category: config
    initial_value: "stop, nevermind, never mind, cancel, abort, dismiss, quit, silence, quiet, shut up"
    restore_value: true
    optimistic: true
    min_length: 0
    max_length: 255
    mode: text

text_sensor:
  - platform: template
    id: satellite_fsm_state
    name: "Satellite State"
    icon: "mdi:robot"
    entity_category: diagnostic
    lambda: |-
      static std::string last_state = "";
      std::string current = get_satellite_state_name();
      if (current != last_state) {
        last_state = current;
        return { current };
      }
      return {};
    update_interval: 250ms

select:
  - platform: template
    id: active_wake_word
    name: "Active Wake Word"
    icon: "mdi:ear-hearing"
    entity_category: config
    optimistic: true
    initial_option: "Mr. Clemens"
    restore_value: true
    options:
      - "Mr. Clemens"
      - "Okay Nabu"
      - "All"
    set_action:
      - lambda: |-
          esphome::wake_loader::get_wake_partition_loader().handle_active_wake_word_change(
              x, id(clemens_model), id(nabu_model));
      - if:
          condition:
            and:
              - switch.is_off: mic_mute_switch
              - api.connected:
          then:
            - micro_wake_word.start:

  - platform: template
    id: wake_word_sensitivity
    name: "Wake Word Sensitivity"
    icon: "mdi:tune"
    entity_category: config
    optimistic: true
    initial_option: "Moderately sensitive"
    restore_value: true
    options:
      - "Slightly sensitive"
      - "Moderately sensitive"
      - "Very sensitive"
    set_action:
      - lambda: |-
          esphome::wake_loader::get_wake_partition_loader().handle_sensitivity_change(
              x, id(clemens_model), id(nabu_model));

  - platform: template
    id: processing_sound
    name: "Processing Sound"
    icon: "mdi:progress-clock"
    entity_category: config
    optimistic: true
    initial_option: ${processing_sound_default}
    restore_value: true
    options:
      - "Spinner"
      - "Pulse"
      - "Sonar"
      - "Tick"
      - "Typewriter"
      - "Clockwork"
      - "Water Droplets"
      - "Raindrops"
      - "Forest Stream"
      - "Campfire Ember"
      - "Shishi-Odoshi"
      - "Soft Footsteps"
      - "Radar Ping"
      - "Data Crunch"
      - "Telemetry Blip"
      - "Quantum Flux"
      - "Retro Terminal"
      - "Silent"
      - "Custom"
    set_action:
      - lambda: |-
          call_nim_action_set_processing_sound(x.c_str());
          float vol = id(processing_sound_volume).state / 100.0f;
          esphome::get_pcm_sound_player().play_processing_sound(x, false, vol);

  - platform: template
    id: wake_chime_sound
    name: "Wake Chime Sound"
    icon: "mdi:bell-ring"
    entity_category: config
    optimistic: true
    initial_option: ${wake_chime_sound_default}
    restore_value: true
    options:
      - "Bell Ping"
      - "Modern Chime"
      - "Crystal Glass"
      - "Warm Kalimba"
      - "Meditation Bell"
      - "Marimba"
      - "Subtle Beep"
      - "Bamboo Chime"
      - "Tibetan Bowl"
      - "Acoustic Harp"
      - "Woodblock"
      - "Ceramic Bell"
      - "Neon Shimmer"
      - "Prism Ping"
      - "Cyber Bloom"
      - "Quantum Beep"
      - "Aero Chime"
      - "Silent"
      - "Custom"
    set_action:
      - lambda: |-
          call_nim_action_set_chime_sound(x.c_str());
          float vol = id(wake_chime_volume).state / 100.0f;
          esphome::get_pcm_sound_player().play_chime(x, false, vol);

  - platform: template
    id: cancel_sound_sound
    name: "Cancel Sound"
    icon: "mdi:bell-cancel"
    entity_category: config
    optimistic: true
    initial_option: "Match Wake Chime"
    restore_value: true
    options:
      - "Match Wake Chime"
      - "Bell Ping"
      - "Modern Chime"
      - "Crystal Glass"
      - "Warm Kalimba"
      - "Meditation Bell"
      - "Marimba"
      - "Subtle Beep"
      - "Bamboo Chime"
      - "Tibetan Bowl"
      - "Acoustic Harp"
      - "Woodblock"
      - "Ceramic Bell"
      - "Neon Shimmer"
      - "Prism Ping"
      - "Cyber Bloom"
      - "Quantum Beep"
      - "Aero Chime"
      - "Silent"
    set_action:
      - lambda: |-
          if (x != "Silent") {
            std::string opt = x;
            if (opt == "Match Wake Chime") {
              opt = id(wake_chime_sound).current_option();
            }
            float vol = id(cancel_sound_volume).state / 100.0f;
            esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
          }

  - platform: template
    id: led_pattern
    name: "LED Idle Pattern"
    icon: "mdi:led-strip-variant"
    entity_category: config
    optimistic: true
    initial_option: "Off"
    restore_value: true
    options:
      - "Off"
      - "Breathe"
      - "Rainbow"
      - "Spinner"

number:
  - platform: template
    id: voice_volume
    name: "Voice Volume"
    icon: "mdi:volume-high"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    initial_value: ${voice_volume_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(board_speaker).set_volume(x / 100.0f);

  - platform: template
    id: processing_sound_volume
    name: "Processing Sound Volume"
    icon: "mdi:volume-medium"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    initial_value: ${processing_sound_volume_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          call_nim_action_set_processing_volume(x);
          std::string opt = id(processing_sound).current_option();
          esphome::get_pcm_sound_player().play_processing_sound(opt, false, x / 100.0f);

  - platform: template
    id: wake_chime_volume
    name: "Wake Chime Volume"
    icon: "mdi:volume-high"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    initial_value: ${wake_chime_volume_default}
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          call_nim_action_set_chime_volume(x);
          std::string opt = id(wake_chime_sound).current_option();
          esphome::get_pcm_sound_player().play_chime(opt, false, x / 100.0f);

  - platform: template
    id: cancel_sound_volume
    name: "Cancel Sound Volume"
    icon: "mdi:volume-medium"
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 80
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          if (id(cancel_sound_switch).state) {
            std::string opt = id(cancel_sound_sound).current_option();
            if (opt == "Match Wake Chime") {
              opt = id(wake_chime_sound).current_option();
            }
            esphome::get_pcm_sound_player().play_cancel_sound(opt, false, x / 100.0f);
          }

  - platform: template
    id: led_brightness
    name: "LED Brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: 0.5
    restore_value: true
    optimistic: true

switch:
  - platform: template
    id: mic_mute_switch
    name: "Privacy Mute"
    icon: "mdi:microphone-off"
    optimistic: true
    on_turn_on:
      - lambda: |-
          call_nim_action_set_mute(true);
          esphome::xvf3800::XVF3800Hardware::instance().write_gpo_pin(esphome::xvf3800::PIN_MIC_MUTE, 1);
      - voice_assistant.stop:
      - micro_wake_word.stop:
    on_turn_off:
      - lambda: |-
          call_nim_action_set_mute(false);
          esphome::xvf3800::XVF3800Hardware::instance().write_gpo_pin(esphome::xvf3800::PIN_MIC_MUTE, 0);
      - if:
          condition:
            api.connected:
          then:
            - micro_wake_word.start:

  - platform: template
    id: wake_chime
    name: "Wake Chime"
    icon: "mdi:bell-ring"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: cancel_sound_switch
    name: "Cancel Sound"
    icon: "mdi:bell-cancel"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

script:
  - id: connect_and_start_assistant
    mode: restart
    parameters:
      ww: string
    then:
      - micro_wake_word.stop:
      - lambda: |-
          std::string opt = id(processing_sound).current_option();
          float vol = id(processing_sound_volume).state / 100.0f;
          esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
          if (wifi::global_wifi_component != nullptr && !wifi::global_wifi_component->is_connected()) {
            ESP_LOGI("satellite", "Wake word detected while offline. Initiating Wi-Fi connection...");
            wifi::global_wifi_component->retry_connect();
          } else {
            ESP_LOGI("satellite", "Wake word detected while Home Assistant API disconnected. Waiting for API...");
          }
      - wait_until:
          condition:
            api.connected:
          timeout: 8s
      - lambda: |-
          esphome::get_pcm_sound_player().stop();
      - if:
          condition:
            api.connected:
          then:
            - if:
                condition:
                  switch.is_on: wake_chime
                then:
                  - lambda: |-
                      std::string opt = id(wake_chime_sound).current_option();
                      float vol = id(wake_chime_volume).state / 100.0f;
                      esphome::get_pcm_sound_player().play_chime(opt, false, vol);
                  - delay: 50ms
                  - wait_until:
                      condition:
                        lambda: |-
                          return !esphome::get_pcm_sound_player().is_playing();
                      timeout: 1800ms
            - voice_assistant.start:
                wake_word: !lambda return ww;
          else:
            - lambda: |-
                ESP_LOGW("satellite", "Connection attempt timed out. Could not reach Home Assistant.");
                call_nim_error("API not connected");
                if (id(cancel_sound_switch).state) {
                  std::string opt = id(cancel_sound_sound).current_option();
                  if (opt == "Match Wake Chime") {
                    opt = id(wake_chime_sound).current_option();
                  }
                  if (opt != "Silent") {
                    float vol = id(cancel_sound_volume).state / 100.0f;
                    esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
                  }
                }
            - if:
                condition:
                  switch.is_off: mic_mute_switch
                then:
                  - micro_wake_word.start:

button:
  - platform: template
    id: reset_audio_hardware_btn
    name: "Reset Audio Hardware"
    icon: "mdi:restart"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("satellite", "Resetting AIC3104 codec and rebooting XMOS SoC...");
          uint8_t rst[2] = {0x01, 0x80};
          id(bus_a).write(0x18, rst, 2);
          delay(10);
          esphome::xvf3800::XVF3800Hardware::instance().reboot_xmos();

interval:
  - interval: 50ms
    then:
      - lambda: |-
          std::string state_str = get_satellite_state_name();
          std::string pattern_str = id(led_pattern).current_option();
          float brightness = id(led_brightness).state;
          esphome::xvf3800::XVF3800Hardware::instance().update_animation(state_str, pattern_str, brightness);

  # Self-healing watchdog: monitors active state duration and guarantees wake word listening
  - interval: 2s
    then:
      - lambda: |-
          static uint32_t active_start_ms = 0;
          std::string s = get_satellite_state_name();
          if (s == "Idle") {
            active_start_ms = 0;
            if (id(mic_mute_switch).state == false && id(mww).is_running() == false) {
              ESP_LOGW("satellite", "Watchdog: Satellite in %s state without active wake word listening. Resuming microWakeWord.", s.c_str());
              id(mww).start();
            }
          } else if (s == "Replying") {
            // Keep resetting timeout while speaker is actively streaming audio
            if (id(board_speaker).is_running()) {
              active_start_ms = millis();
            } else if (active_start_ms == 0) {
              active_start_ms = millis();
            } else if (millis() - active_start_ms > 20000) {
              ESP_LOGW("satellite", "Watchdog: Satellite in Replying without audio playback for >20s. Forcing reset to Idle.");
              active_start_ms = 0;
              id(va).request_stop();
              esphome::get_pcm_sound_player().stop();
              call_nim_stop_word();
              if (id(mic_mute_switch).state == false) {
                id(mww).start();
              }
            }
          } else if (s == "Thinking" || s == "Listening" || s == "Woken") {
            if (active_start_ms == 0) {
              active_start_ms = millis();
            } else {
              uint32_t elapsed = millis() - active_start_ms;
              uint32_t max_allowed = (s == "Thinking") ? 45000 : 25000;
              if (elapsed > max_allowed) {
                ESP_LOGW("satellite", "Watchdog: Satellite stuck in '%s' for %u ms! Forcing reset to Idle.", s.c_str(), elapsed);
                active_start_ms = 0;
                id(va).request_stop();
                esphome::get_pcm_sound_player().stop();
                call_nim_stop_word();
                if (id(cancel_sound_switch).state) {
                  std::string opt = id(cancel_sound_sound).current_option();
                  if (opt == "Match Wake Chime") {
                    opt = id(wake_chime_sound).current_option();
                  }
                  if (opt != "Silent") {
                    float vol = id(cancel_sound_volume).state / 100.0f;
                    esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
                  }
                }
                if (id(mic_mute_switch).state == false) {
                  id(mww).start();
                }
              }
            }
          } else {
            // Passive or connection error states - reset watchdog timer
            active_start_ms = 0;
          }


