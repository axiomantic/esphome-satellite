script:
  - id: connect_and_start_assistant
    mode: restart
    parameters:
      ww: string
    then:
      - micro_wake_word.stop:
      - lambda: |-
          std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_processing_sound).current_option() : id(slot1_processing_sound).current_option();
          float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
          esphome::get_pcm_sound_player().play_processing_sound(opt, true, vol);
          if (wifi::global_wifi_component != nullptr && !wifi::global_wifi_component->is_connected()) {
            ESP_LOGI("satellite", "Wake word detected while offline. Initiating Wi-Fi connection...");
            wifi::global_wifi_component->retry_connect();
          } else {
            ESP_LOGI("satellite", "Wake word detected while Home Assistant API disconnected. Waiting for API...");
          }
      - wait_until:
          condition:
            api.connected:
          timeout: 8s
      - lambda: |-
          esphome::get_pcm_sound_player().stop();
      - if:
          condition:
            api.connected:
          then:
            - if:
                condition:
                  lambda: |-
                    bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime).state : id(slot1_wake_chime).state;
                    std::string snd = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                    return enabled && snd != "Silent";
                then:
                  - lambda: |-
                      std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                      float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
                      esphome::get_pcm_sound_player().play_chime(opt, false, vol);
                  - delay: 50ms
                  - wait_until:
                      condition:
                        lambda: |-
                          return !esphome::get_pcm_sound_player().is_playing();
                      timeout: 1800ms
            - voice_assistant.start:
                wake_word: !lambda return ww;
          else:
            - lambda: |-
                ESP_LOGW("satellite", "Connection attempt timed out. Could not reach Home Assistant.");
                call_nim_error("API not connected");
                bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
                if (enabled) {
                  std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
                  if (opt == "Match Wake Chime") {
                    opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                  }
                  if (opt != "Silent") {
                    float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
                    esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
                  }
                }
            - if:
                condition:
                  lambda: |-
                    return !esphome::get_pcm_sound_player().is_playing_cancel() && !id(mic_mute_switch).state;
                then:
                  - micro_wake_word.start:

button:
  - platform: template
    id: reset_conversation_history_btn
    name: "Voice: Reset Conversation History"
    icon: "mdi:comment-remove-outline"
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGI("voice_assistant", "Explicit conversation history reset triggered by user button.");
          id(va).reset_conversation_id();
          id(va).request_stop();
          esphome::get_pcm_sound_player().stop();
          call_nim_stop_word();
          bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
          if (enabled) {
            std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
            if (opt == "Match Wake Chime") {
              opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
            }
            float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
            if (opt != "Silent") {
              esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
            } else {
              call_nim_cancel_done(true);
            }
          } else {
            call_nim_cancel_done(true);
          }

  - platform: template
    id: reset_audio_hardware_btn
    name: "Hardware: Reset Audio Hardware"
    icon: "mdi:restart"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("satellite", "Resetting AIC3104 codec and rebooting XMOS SoC...");
          uint8_t rst[2] = {0x01, 0x80};
          id(bus_a).write(0x18, rst, 2);
          delay(10);
          esphome::xvf3800::XVF3800Hardware::instance().reboot_xmos();

  - platform: template
    id: update_firmware_btn
    name: "System: Update Firmware to Latest"
    icon: "mdi:cloud-download"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(satellite_firmware_update).has_state() && id(satellite_firmware_update).state == esphome::update::UPDATE_STATE_AVAILABLE) {
            ESP_LOGI("satellite", "Initiating OTA update via satellite_firmware_update component...");
            id(satellite_firmware_update).perform(false);
          } else {
            ESP_LOGI("satellite", "Initiating direct OTA update from main branch...");
            esphome::wake_loader::get_wake_partition_loader().flash_firmware_ota(
                "https://raw.githubusercontent.com/axiomantic/esphome-satellite/main/web/firmware-ota.bin");
          }

  - platform: template
    id: flash_firmware_channel_btn
    name: "System: Flash Selected Firmware"
    icon: "mdi:flash"
    entity_category: config
    on_press:
      - lambda: |-
          std::string channel = id(firmware_version_channel).current_option();
          std::string url;
          if (channel == "Latest Official (main)") {
            url = "https://raw.githubusercontent.com/axiomantic/esphome-satellite/main/web/firmware-ota.bin";
          } else {
            url = id(custom_firmware_url).state;
          }
          ESP_LOGI("satellite", "Flashing firmware from channel '%s': %s", channel.c_str(), url.c_str());
          esphome::wake_loader::get_wake_partition_loader().flash_firmware_ota(url);

  - platform: template
    id: clear_custom_wake_models_btn
    name: "System: Clear Custom Wake Models"
    icon: "mdi:delete-sweep"
    entity_category: config
    on_press:
      - lambda: |-
          for (int s = 1; s <= 3; s++) {
            esphome::wake_loader::get_wake_partition_loader().remove_custom_wake_word(s);
          }
          extern void nim_satellite_restart(void) __attribute__((weak));
          if (nim_satellite_restart != nullptr) nim_satellite_restart();
          else esp_restart();

  - platform: restart
    id: restart_satellite_btn
    name: "System: Restart Satellite"
    icon: "mdi:restart-alert"
    entity_category: config

interval:
  - interval: 50ms
    then:
      - lambda: |-
          std::string state_str = get_satellite_state_name();
          std::string pattern_str = id(led_pattern).current_option();
          float brightness = id(led_brightness).state;
          esphome::xvf3800::XVF3800Hardware::instance().update_animation(state_str, pattern_str, brightness);

  # Live microWakeWord inference monitor for Mr. Clemens
  - interval: 250ms
    then:
      - lambda: |-
          if (id(mww).is_running()) {
            uint8_t cur = esphome::wake_loader::get_wake_partition_loader().get_model_max_prob(id(clemens_model));
            float avg = esphome::wake_loader::get_wake_partition_loader().get_model_avg_prob(id(clemens_model));
            if (cur > 15) {
              ESP_LOGI("clemens_prob", "Live inference -> max: %.2f, avg: %.2f (cutoff: %.2f)",
                       cur / 255.0f, avg,
                       esphome::wake_loader::get_wake_partition_loader().get_active_cutoff_for_slot(1) / 255.0f);
            }
          }

  # Self-healing watchdog: monitors active state duration and guarantees wake word listening
  - interval: 2s
    then:
      - lambda: |-
          if (id(satellite_firmware_update).has_state()) {
            bool avail = (id(satellite_firmware_update).state == esphome::update::UPDATE_STATE_AVAILABLE);
            if (id(firmware_update_available).state != avail) {
              id(firmware_update_available).publish_state(avail);
            }
          }
          static uint32_t active_start_ms = 0;
          std::string s = get_satellite_state_name();
          if (s == "Idle") {
            active_start_ms = 0;
            if (id(mic_mute_switch).state == false && id(mww).is_running() == false) {
              ESP_LOGW("satellite", "Watchdog: Satellite in %s state without active wake word listening. Resuming microWakeWord.", s.c_str());
              id(mww).start();
            }
          } else if (s == "Replying") {
            // Keep resetting timeout while speaker is actively streaming audio
            if (id(board_speaker).is_running()) {
              active_start_ms = millis();
            } else if (active_start_ms == 0) {
              active_start_ms = millis();
            } else if (millis() - active_start_ms > 20000) {
              ESP_LOGW("satellite", "Watchdog: Satellite in Replying without audio playback for >20s. Forcing reset to Idle.");
              active_start_ms = 0;
              id(va).request_stop();
              esphome::get_pcm_sound_player().stop();
              call_nim_stop_word();
              if (id(mic_mute_switch).state == false) {
                id(mww).start();
              }
            }
          } else if (s == "Thinking" || s == "Listening" || s == "Woken" || s == "Follow Up") {
            if (active_start_ms == 0) {
              active_start_ms = millis();
            } else {
              uint32_t elapsed = millis() - active_start_ms;
              uint32_t max_allowed = (s == "Thinking") ? 45000 : 25000;
              if (elapsed > max_allowed) {
                ESP_LOGW("satellite", "Watchdog: Satellite stuck in '%s' for %u ms! Forcing reset to Idle.", s.c_str(), elapsed);
                active_start_ms = 0;
                id(va).request_stop();
                esphome::get_pcm_sound_player().stop();
                call_nim_stop_word();
                bool enabled = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound_switch).state : id(slot1_cancel_sound_switch).state;
                bool played_cancel = false;
                if (enabled) {
                  std::string opt = (id(active_assistant_slot) == 2) ? id(slot2_cancel_sound).current_option() : id(slot1_cancel_sound).current_option();
                  if (opt == "Match Wake Chime") {
                    opt = (id(active_assistant_slot) == 2) ? id(slot2_wake_chime_sound).current_option() : id(slot1_wake_chime_sound).current_option();
                  }
                  if (opt != "Silent") {
                    float vol = ((id(active_assistant_slot) == 2) ? id(slot2_volume).state : id(slot1_volume).state) / 100.0f;
                    esphome::get_pcm_sound_player().play_cancel_sound(opt, false, vol);
                    played_cancel = true;
                  }
                }
                if (!played_cancel) {
                  call_nim_cancel_done(true);
                  if (id(mic_mute_switch).state == false) {
                    id(mww).start();
                  }
                }
              }
            }
          } else {
            // Passive or connection error states - reset watchdog timer
            active_start_ms = 0;
          }


